<style>
.orb-embed-wrap{position:relative;width:100%;height:500px;overflow:hidden;background:#000;}
.orb-embed-wrap canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;}
</style>

<div class="orb-embed-wrap" id="orb-embed"></div>

<script>
(function(){
  var container = document.getElementById('orb-embed');
  if(!container) return;

  /* ── config ───────────────────────────────────────────── */
  var HUE             = 0;      /* 0-360 */
  var HOVER_INTENSITY = 0.5;    /* 0-10  */
  var ROTATE_ON_HOVER = true;
  var BG_COLOR        = '#000000';
  /* ─────────────────────────────────────────────────────── */

  function hexToRGB(c){
    if(c&&c[0]==='#') return [parseInt(c.slice(1,3),16)/255,parseInt(c.slice(3,5),16)/255,parseInt(c.slice(5,7),16)/255];
    var m=c&&c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    return m?[+m[1]/255,+m[2]/255,+m[3]/255]:[0,0,0];
  }

  var VERT=[
    'precision highp float;',
    'attribute vec2 position;attribute vec2 uv;varying vec2 vUv;',
    'void main(){vUv=uv;gl_Position=vec4(position,0.0,1.0);}'
  ].join('\n');

  var FRAG=[
    'precision highp float;',
    'uniform float iTime;uniform vec3 iResolution;uniform float hue;',
    'uniform float hover;uniform float rot;uniform float hoverIntensity;',
    'uniform vec3 backgroundColor;varying vec2 vUv;',
    'vec3 rgb2yiq(vec3 c){return vec3(dot(c,vec3(0.299,0.587,0.114)),dot(c,vec3(0.596,-0.274,-0.322)),dot(c,vec3(0.211,-0.523,0.312)));}',
    'vec3 yiq2rgb(vec3 c){return vec3(c.x+0.956*c.y+0.621*c.z,c.x-0.272*c.y-0.647*c.z,c.x-1.106*c.y+1.703*c.z);}',
    'vec3 adjustHue(vec3 color,float d){float r=d*3.14159265/180.0;vec3 y=rgb2yiq(color);float ca=cos(r),sa=sin(r);float i=y.y*ca-y.z*sa,q=y.y*sa+y.z*ca;y.y=i;y.z=q;return yiq2rgb(y);}',
    'vec3 hash33(vec3 p){p=fract(p*vec3(0.1031,0.11369,0.13787));p+=dot(p,p.yxz+19.19);return -1.0+2.0*fract(vec3(p.x+p.y,p.x+p.z,p.y+p.z)*p.zyx);}',
    'float snoise3(vec3 p){const float K1=0.333333333,K2=0.166666667;vec3 i=floor(p+(p.x+p.y+p.z)*K1);vec3 d0=p-(i-(i.x+i.y+i.z)*K2);vec3 e=step(vec3(0.0),d0-d0.yzx);vec3 i1=e*(1.0-e.zxy),i2=1.0-e.zxy*(1.0-e);vec3 d1=d0-(i1-K2),d2=d0-(i2-K1),d3=d0-0.5;vec4 h=max(0.6-vec4(dot(d0,d0),dot(d1,d1),dot(d2,d2),dot(d3,d3)),0.0);return dot(vec4(31.316),h*h*h*h*vec4(dot(d0,hash33(i)),dot(d1,hash33(i+i1)),dot(d2,hash33(i+i2)),dot(d3,hash33(i+1.0))));}',
    'vec4 extractAlpha(vec3 c){float a=max(max(c.r,c.g),c.b);return vec4(c/(a+1e-5),a);}',
    'const vec3 bc1=vec3(0.611765,0.262745,0.996078),bc2=vec3(0.298039,0.760784,0.913725),bc3=vec3(0.062745,0.078431,0.600000);',
    'const float IR=0.6,NS=0.65;',
    'float L1(float i,float a,float d){return i/(1.0+d*a);}',
    'float L2(float i,float a,float d){return i/(1.0+d*d*a);}',
    'vec4 draw(vec2 uv){',
    '  vec3 c1=adjustHue(bc1,hue),c2=adjustHue(bc2,hue),c3=adjustHue(bc3,hue);',
    '  float ang=atan(uv.y,uv.x),len=length(uv),inv=len>0.0?1.0/len:0.0;',
    '  float bgL=dot(backgroundColor,vec3(0.299,0.587,0.114));',
    '  float n0=snoise3(vec3(uv*NS,iTime*0.5))*0.5+0.5;',
    '  float r0=mix(mix(IR,1.0,0.4),mix(IR,1.0,0.6),n0);',
    '  float d0=distance(uv,(r0*inv)*uv);',
    '  float v0=L1(1.0,10.0,d0);',
    '  v0*=smoothstep(r0*1.05,r0,len);',
    '  v0*=mix(smoothstep(r0*0.8,r0*0.95,len),1.0,bgL*0.7);',
    '  float cl=cos(ang+iTime*2.0)*0.5+0.5;',
    '  float a=iTime*-1.0;vec2 pos=vec2(cos(a),sin(a))*r0;float d=distance(uv,pos);',
    '  float v1=L2(1.5,5.0,d)*L1(1.0,50.0,d0);',
    '  float v2=smoothstep(1.0,mix(IR,1.0,n0*0.5),len);',
    '  float v3=smoothstep(IR,mix(IR,1.0,0.5),len);',
    '  vec3 cb=mix(c1,c2,cl);float fa=mix(1.0,0.1,bgL);',
    '  vec3 dk=clamp((mix(c3,cb,v0)+v1)*v2*v3,0.0,1.0);',
    '  vec3 lk=clamp(mix(backgroundColor,(cb+v1)*mix(1.0,v2*v3,fa),v0),0.0,1.0);',
    '  return extractAlpha(mix(dk,lk,bgL));',
    '}',
    'void main(){',
    '  vec2 fc=vUv*iResolution.xy,ctr=iResolution.xy*0.5;',
    '  float sz=min(iResolution.x,iResolution.y);',
    '  vec2 uv=(fc-ctr)/sz*2.0;',
    '  float s=sin(rot),c=cos(rot);',
    '  uv=vec2(c*uv.x-s*uv.y,s*uv.x+c*uv.y);',
    '  uv.x+=hover*hoverIntensity*0.1*sin(uv.y*10.0+iTime);',
    '  uv.y+=hover*hoverIntensity*0.1*sin(uv.x*10.0+iTime);',
    '  vec4 col=draw(uv);',
    '  gl_FragColor=vec4(col.rgb*col.a,col.a);',
    '}'
  ].join('\n');

  function mkShader(gl,type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}

  var canvas=document.createElement('canvas');
  container.appendChild(canvas);
  var gl=canvas.getContext('webgl',{alpha:true,premultipliedAlpha:false});
  if(!gl) return;

  gl.clearColor(0,0,0,0);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);

  var pb=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,pb);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var ub=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,ub);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,2,0,0,2]),gl.STATIC_DRAW);

  var vs=mkShader(gl,gl.VERTEX_SHADER,VERT),fs=mkShader(gl,gl.FRAGMENT_SHADER,FRAG);
  var prog=gl.createProgram();
  gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
  gl.deleteShader(vs);gl.deleteShader(fs);

  var pLoc=gl.getAttribLocation(prog,'position'),uLoc=gl.getAttribLocation(prog,'uv');
  var uTime=gl.getUniformLocation(prog,'iTime'),uRes=gl.getUniformLocation(prog,'iResolution');
  var uHue=gl.getUniformLocation(prog,'hue'),uHov=gl.getUniformLocation(prog,'hover');
  var uRot=gl.getUniformLocation(prog,'rot'),uHI=gl.getUniformLocation(prog,'hoverIntensity');
  var uBg=gl.getUniformLocation(prog,'backgroundColor');

  gl.useProgram(prog);
  gl.uniform3fv(uBg,hexToRGB(BG_COLOR));
  gl.uniform1f(uHue,HUE);
  gl.uniform1f(uHI,HOVER_INTENSITY);
  gl.uniform1f(uHov,0);
  gl.uniform1f(uRot,0);

  function resize(){
    var dpr=window.devicePixelRatio||1,w=container.clientWidth,h=container.clientHeight;
    canvas.width=w*dpr;canvas.height=h*dpr;
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.useProgram(prog);
    gl.uniform3f(uRes,canvas.width,canvas.height,canvas.width/(canvas.height||1));
  }
  window.addEventListener('resize',resize);resize();

  var th=0,ch=0,cr=0,lt=0;
  container.addEventListener('mousemove',function(e){
    var r=container.getBoundingClientRect(),sz=Math.min(r.width,r.height);
    var x=((e.clientX-r.left-r.width/2)/sz)*2,y=((e.clientY-r.top-r.height/2)/sz)*2;
    th=Math.sqrt(x*x+y*y)<0.8?1:0;
  });
  container.addEventListener('mouseleave',function(){th=0;});

  (function tick(t){
    requestAnimationFrame(tick);
    var dt=(t-lt)*0.001;lt=t;
    ch+=(th-ch)*0.1;
    if(ROTATE_ON_HOVER&&ch>0.5) cr+=dt*0.3;
    gl.useProgram(prog);
    gl.uniform1f(uTime,t*0.001);
    gl.uniform1f(uHov,ch);
    gl.uniform1f(uRot,cr);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.enableVertexAttribArray(pLoc);gl.vertexAttribPointer(pLoc,2,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,ub);gl.enableVertexAttribArray(uLoc);gl.vertexAttribPointer(uLoc,2,gl.FLOAT,false,0,0);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }(0));
}());
</script>
